  <style>
    body { font-family: 'Text Me One', sans-serif; margin: 0; background-color: #0b1221; color: #e0e0e0; }
    h1, h2, h3 { font-family: 'Poiret One', cursive; }

    /* Hero Gradient */
    .gradient-hero { background: linear-gradient(135deg, #004d4d, #00ffff); }

    /* Sections Gradient: darker cyan → bright cyan */
    .gradient-cyan {
      background: linear-gradient(to bottom, #004d4d, #00cccc);
      transition: background 0.5s ease;
    }

    /* Avatar */
    .avatar { width: 150px; height: 150px; border-radius: 50%; border: 4px solid white; margin-bottom: 20px; }

    /* Transparent hover cards */
    .hover-card {
      background: rgba(255,255,255,0.05);
      padding: 2rem;
      border-radius: 1rem;
      overflow: hidden;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .hover-content {
      opacity: 0;
      max-height: 0;
      transition: opacity 0.4s ease, max-height 0.4s ease;
    }

    .hover-card:hover .hover-content {
      opacity: 1;
      max-height: 500px;
    }

    /* Project cards */
    .project-card {
      background: rgba(255,255,255,0.05);
      padding: 1.5rem;
      border-radius: 0.75rem;
      transition: transform 0.3s ease, background 0.3s ease;
    }
    .project-card a { color: #003333; text-decoration: underline; }
  </style>
</head>
